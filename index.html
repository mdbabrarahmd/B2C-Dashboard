<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Analytics Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#f8faf9;
  font-family:'Segoe UI',Arial,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── Top bar ── */
.topbar{
  background:#145a32;
  padding:0 40px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.topbar-logo{
  display:flex;align-items:center;gap:10px;
  font-size:1.05rem;font-weight:700;color:#fff;letter-spacing:.01em;
}
.topbar-logo svg{width:26px;height:26px;fill:#a8d5b5}
.topbar-right{font-size:.72rem;color:#a8d5b5;letter-spacing:.05em;text-transform:uppercase}

/* ── Hero band ── */
.hero{
  background:linear-gradient(135deg,#145a32 0%,#1e8449 60%,#27ae60 100%);
  padding:52px 40px 44px;
  text-align:center;
  color:#fff;
}
.hero h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.hero h1 span{color:#a8d5b5}
.hero p{font-size:.85rem;color:#c8e6c9;letter-spacing:.05em;text-transform:uppercase;font-weight:600}

/* ── Cards grid ── */
.grid-wrap{
  max-width:1000px;
  margin:0 auto;
  padding:40px 24px 60px;
  flex:1;
}
.section-lbl{
  font-size:.67rem;font-weight:700;color:#1e8449;text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:16px;padding-left:2px;
}
.cards{display:flex;gap:24px;flex-wrap:wrap}

.card{
  flex:1;min-width:280px;max-width:420px;
  background:#fff;
  border:1px solid #d5e8db;
  border-radius:14px;
  padding:28px 28px 24px;
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:12px;
  position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s;
  box-shadow:0 2px 8px rgba(20,90,50,.06);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#145a32,#27ae60);
  border-radius:14px 14px 0 0;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(20,90,50,.14);
}

.card-icon{
  width:46px;height:46px;border-radius:10px;
  background:#e8f5e9;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
}
.card-title{font-size:1.05rem;font-weight:700;color:#145a32}
.card-desc{font-size:.78rem;color:#555;line-height:1.6;flex:1}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:20px;
  background:#e8f5e9;color:#1e8449;
}
.card-arrow{
  position:absolute;bottom:24px;right:24px;
  font-size:1.1rem;color:#c8e6c9;
  transition:color .18s,transform .18s;
}
.card:hover .card-arrow{color:#27ae60;transform:translate(3px,-3px)}

/* ── Footer ── */
footer{
  background:#145a32;
  text-align:center;
  padding:14px;
  font-size:.67rem;
  color:#a8d5b5;
  letter-spacing:.05em;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">
    <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3zm0 8h18v2H3zm0 8h18v2H3z"/></svg>
    Analytics Hub
  </div>
  <div class="topbar-right">Internal Use Only</div>
</div>

<div class="hero">
  <h1>Business <span>Intelligence</span> Dashboards</h1>
  <p>Finance &amp; Operations Analytics</p>
</div>

<div class="grid-wrap">
  <div class="section-lbl">Available Dashboards</div>
  <div class="cards" id="cards"></div>
  <div id="none-msg" style="display:none;text-align:center;color:#555;font-size:.9rem;padding:40px 0">
    You do not have access to any dashboards yet. Please contact the dashboard owner.
  </div>
</div>

<footer>&copy; 2026 &mdash; Confidential &mdash; Authorized Access Only</footer>


<script>
/* ADD NEW DASHBOARDS HERE: one entry each. The hub only shows a card if the
   signed-in user can actually open that page (Cloudflare Access answers 403 /
   login-redirect otherwise), so restricted dashboards stay invisible to people
   who are not allowed to see them. */
var DASHBOARDS=[
  {href:"AR Dashboard Live.html",icon:"\u26A1",title:"AR Receivables Dashboard (Live)",
   desc:"Real-time accounts receivable tracking. Monitor live overdue aging data, instant DSO trend updates, and active exception approval workflows.",
   tags:[{t:"\u{1F534} Live Feed",s:"background:#ffebee;color:#c62828;"},{t:"Real-Time Data"}]},
  {href:"exceptions/",icon:"\u{1F4CB}",title:"Exception Approval",
   desc:"Salesman exception requests: look up any customer, check credit limit and overdue status, and prepare the approval sheet.",
   tags:[{t:"Sales Team"},{t:"Approval Workflow"}]}
];
(function(){
  var box=document.getElementById('cards'),shown=0,pending=DASHBOARDS.length;
  function add(d){
    var a=document.createElement('a');a.className='card';a.href=d.href;
    var h='<div class="card-icon">'+d.icon+'</div><div class="card-title"></div><div class="card-desc"></div><div class="card-tags">';
    (d.tags||[]).forEach(function(g){h+='<span class="tag"'+(g.s?' style="'+g.s+'"':'')+'></span>';});
    h+='</div><div class="card-arrow">&#x2197;</div>';
    a.innerHTML=h;
    a.querySelector('.card-title').textContent=d.title;
    a.querySelector('.card-desc').textContent=d.desc;
    var tg=a.querySelectorAll('.tag');(d.tags||[]).forEach(function(g,i){tg[i].textContent=g.t;});
    box.appendChild(a);shown++;
  }
  function done(){pending--;if(pending===0&&shown===0)document.getElementById('none-msg').style.display='block';}
  DASHBOARDS.forEach(function(d){
    fetch(d.href,{method:'HEAD',credentials:'same-origin',redirect:'manual',cache:'no-store'})
      .then(function(r){if(r.ok)add(d);done();})
      .catch(function(){add(d);done();});   /* network/file:// problem: fail open (page itself is still protected) */
  });
})();
</script>
</body>
</html>
